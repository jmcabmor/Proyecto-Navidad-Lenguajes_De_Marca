<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Shop</title>
</head>
<body>
    <div style="width: 1897px;display: flex;justify-content: center;align-items: center;height: 900px;">
        <div style="width: 500px;height: 600px;background-color: gainsboro;border-radius: 20px;text-align: center;box-shadow: 5px 5px 5px gray;">
            <br><br><br><br><br>
            <h1 style="font-family: Arial, Helvetica, sans-serif;">Regístrate</h1>
            <br>
            <form action="index.html">
                <input type="text" style="width: 300px;height: 30px;" placeholder="Introduce tu correo electrónico..." required>
                <br><br><br>
                <input type="text" style="width: 300px;height: 30px;" placeholder="Introduce una contraseña..." required>
                <br><br><br>
                <input type="text" style="width: 300px;height: 30px;" placeholder="Repite la contraseña..." required>
                <br><br><br>
                <input type="submit" value="Registrarse" style="width: 300px;height: 50px;border-radius: 20px;font-size: 20px;background: linear-gradient(gray,white);" >
                <br><br>
            </form>
        </div>
    </div>
</body>
</html>
